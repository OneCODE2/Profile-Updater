services:
  - type: web
    name: Profile-Updater
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:web
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CRON_SECRET
        generateValue: true

  - type: cron
    name: Profile-Updater-Tick
    runtime: node
    plan: free
    schedule: "*/5 * * * *"
    buildCommand: npm install
    startCommand: node -e "fetch(process.env.TICK_URL,{method:'POST',headers:{'x-cron-secret':process.env.CRON_SECRET}}).then(r=>r.text()).then(console.log)"
    envVars:
      - key: TICK_URL
        sync: false
      - key: CRON_SECRET
        sync: false
